<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<title>Clips · MixTheVid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- las fuentes se cargan sin bloquear: la página se pinta ya y luego cambian -->
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"></noscript>
<style>
  :root {
    --bg: #0a0a0b;
    --line: #26262b;
    --ink: #ece6da;
    --mute: #8a857c;
    --live: #18c4e4;
    --ar: 16 / 9;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: var(--bg); color: var(--ink); }
  body {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 13px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: clamp(16px, 3vw, 40px) 16px 32px;
    /* en horizontal, que el contenido no quede bajo la muesca del móvil */
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
  }

  /* ---------- galería: el primero grande, los otros cuatro en dos columnas ---------- */
  .gallery {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: clamp(10px, 2vw, 20px);
  }
  .clip:first-child { grid-column: 1 / -1; }
  .screen {
    position: relative;
    aspect-ratio: var(--ar);
    background: #000;
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 0 0 1px var(--line), 0 40px 90px -50px rgba(24, 196, 228, .35);
    cursor: zoom-in;
    -webkit-tap-highlight-color: transparent;
  }
  .screen:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .screen video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .clip-n {
    position: absolute;
    left: clamp(10px, 2vw, 18px);
    bottom: clamp(8px, 1.6vw, 14px);
    z-index: 2;
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 900;
    font-size: clamp(36px, 6vw, 72px);
    line-height: .8;
    color: #fff;
    mix-blend-mode: difference;
    pointer-events: none;
  }
  .clip:first-child .clip-n { font-size: clamp(54px, 10vw, 132px); }

  /* progreso de descarga: el clip se va llenando de abajo arriba */
  .fill, .pct {
    position: absolute; inset: 0;
    z-index: 1;
    pointer-events: none;
    transition: opacity .5s;
  }
  .fill {
    --h: calc(var(--load, 0) * 100%);
    background: linear-gradient(to top,
      rgba(24, 196, 228, .35) calc(var(--h) - 2px),
      var(--live) calc(var(--h) - 2px) var(--h),
      rgba(0, 0, 0, .55) var(--h));
  }
  .pct {
    display: grid; place-items: center;
    font-size: 12px; font-weight: 600; letter-spacing: .08em;
    text-shadow: 0 1px 6px #000;
  }
  .clip:not(.loading) .fill,
  .clip:not(.loading) .pct { opacity: 0; }

  .gate {
    position: absolute; inset: 0;
    z-index: 3;
    display: none;
    place-items: center;
    background: rgba(0, 0, 0, .55);
    border: 0; color: inherit; font: inherit;
    cursor: pointer;
  }
  .gate.show { display: grid; }
  .gate span {
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 900; font-size: 28px; text-transform: uppercase;
    padding: 8px 20px;
    background: var(--live); color: #000;
  }

  /* pantalla completa: el clip ocupa todo lo visible, sea cual sea la forma del móvil */
  .screen.fake-fs {
    position: fixed;
    z-index: 100;
    top: 0; left: 0;
    width: 100vw;
    width: 100dvw;
    height: 100vh;
    height: 100dvh;
    aspect-ratio: auto;
    border-radius: 0;
    cursor: zoom-out;
  }
  .screen.fake-fs video { object-fit: contain; }
  .screen.fake-fs .clip-n { display: none; }
  /* con el móvil en vertical, el vídeo se gira para verse en horizontal */
  @media (orientation: portrait) {
    .screen.fake-fs {
      top: 50%; left: 50%;
      width: 100vh;
      width: 100dvh;
      height: 100vw;
      height: 100dvw;
      transform: translate(-50%, -50%) rotate(90deg);
    }
  }
  body.fs-lock { overflow: hidden; }

  .fs-close {
    position: absolute;
    top: clamp(10px, 2vw, 18px);
    right: clamp(10px, 2vw, 18px);
    z-index: 5;
    display: none;
    place-items: center;
    width: 40px; height: 40px;
    border: 0; border-radius: 2px;
    background: rgba(10, 10, 11, .6);
    color: var(--ink);
    font: inherit; font-size: 18px;
    cursor: pointer;
  }
  .screen.fake-fs .fs-close { display: grid; }

  footer {
    margin-top: clamp(20px, 4vw, 36px);
    padding-top: 14px;
    border-top: 1px solid var(--line);
    display: flex; gap: 8px 24px; flex-wrap: wrap;
    font-size: 12px; color: var(--mute);
  }
  footer a { color: var(--ink); text-decoration: none; }
  footer a:hover { color: var(--live); }

  @media (max-width: 560px) {
    .gallery { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<main class="wrap">
  <section class="gallery" aria-label="Clips"></section>
  <footer>
    <a href="tel:+34661636377">661 63 63 77</a>
    <a href="mailto:andipl2323@gmail.com">andipl2323@gmail.com</a>
  </footer>
</main>

<script>
(() => {
  // Los vídeos salen de "propuesta loops/web", que genera optimizar_videos.py a partir
  // de los originales. Tras cambiar un clip: ejecuta ese script y sube este número,
  // para que el navegador no siga mostrando la copia antigua que tiene guardada.
  const VIDEO_VERSION = 11;

  const CLIPS = [
    'propuesta loops/web/cara video.mp4',
    'propuesta loops/web/caras.mp4',
    'propuesta loops/web/fondo.mp4',
    'propuesta loops/web/sombra.mp4',
    'propuesta loops/web/playa.mp4',
  ];

  // En móviles se usan las versiones ligeras ("propuesta loops/web/movil").
  const LIGHT = matchMedia('(pointer: coarse)').matches;
  const videoUrl = src =>
    `${encodeURI(LIGHT ? src.replace('/web/', '/web/movil/') : src)}?v=${VIDEO_VERSION}`;
  // Primer fotograma de cada clip, muy ligero: se ve al instante mientras carga.
  const posterUrl = src =>
    `${encodeURI(src.replace('/web/', '/web/portada/').replace(/\.mp4$/, '.jpg'))}?v=${VIDEO_VERSION}`;

  // Cada clip se descarga entero antes de usarlo, así nunca se queda parado esperando
  // datos a mitad de reproducción. Se bajan de uno en uno para que cada uno llegue
  // cuanto antes, y primero los que están a la vista.
  // Si la descarga falla, ese clip se reproduce directamente del servidor.
  const pending = [];
  let busy = false, visibleKnown = false;  // no se empieza hasta saber qué se ve
  function fetchClip(src, isVisible, onProgress) {
    return new Promise(resolve => { pending.push({ src, isVisible, onProgress, resolve }); pump(); });
  }
  function pump() {
    if (busy || !visibleKnown || !pending.length) return;
    const k = Math.max(0, pending.findIndex(job => job.isVisible()));
    const { src, onProgress, resolve } = pending.splice(k, 1)[0];
    const url = videoUrl(src);
    busy = true;
    fetch(url)
      .then(r => { if (!r.ok) throw new Error(r.status); return readWithProgress(r, onProgress); })
      .then(b => URL.createObjectURL(b), () => url)
      .then(resolve)
      .finally(() => { busy = false; pump(); });
  }
  // Lee la descarga a trozos para ir avisando de cuánto lleva (de 0 a 1).
  async function readWithProgress(r, onProgress) {
    const total = Number(r.headers.get('Content-Length'));
    if (!total || !r.body) return r.blob();
    const reader = r.body.getReader();
    const chunks = [];
    let got = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      got += value.length;
      onProgress(Math.min(1, got / total));
    }
    return new Blob(chunks, { type: r.headers.get('Content-Type') || 'video/mp4' });
  }

  const pad = n => String(n).padStart(2, '0');
  const gallery = document.querySelector('.gallery');
  const nativeFsEl = () => document.fullscreenElement || document.webkitFullscreenElement;

  function createClip(src, i) {
    const fig = document.createElement('figure');
    fig.className = 'clip loading';
    fig.innerHTML = `<div class="screen" role="button" tabindex="0" aria-label="Clip ${pad(i + 1)}, ver a pantalla completa">
        <div class="fill"></div><span class="pct">0 %</span>
        <span class="clip-n">${pad(i + 1)}</span>
        <button class="gate" type="button"><span>▶ Reproducir</span></button>
        <button class="fs-close" type="button" aria-label="Salir de pantalla completa">✕</button>
      </div>`;
    gallery.appendChild(fig);
    const screen = fig.querySelector('.screen');
    const gate = fig.querySelector('.gate');
    const pct = fig.querySelector('.pct');

    const v = document.createElement('video');
    v.poster = posterUrl(src);
    v.muted = true; v.loop = true; v.playsInline = true;
    v.preload = 'auto';
    v.setAttribute('muted', ''); v.setAttribute('playsinline', '');
    screen.prepend(v);
    v.addEventListener('loadedmetadata', () => {
      if (v.videoWidth && v.videoHeight) fig.style.setProperty('--ar', `${v.videoWidth} / ${v.videoHeight}`);
    }, { once: true });

    let visible = false, ready = false;
    const isFs = () => screen.classList.contains('fake-fs');

    // Solo pedimos un toque si el navegador ha bloqueado de verdad la reproducción
    // (p. ej. modo ahorro de batería en iPhone).
    function checkBlocked() {
      setTimeout(() => gate.classList.toggle('show', ready && (visible || isFs()) && v.paused), 600);
    }
    v.addEventListener('playing', checkBlocked);
    gate.addEventListener('click', e => {
      e.stopPropagation();
      v.play().catch(() => {}).finally(checkBlocked);
    });

    // Solo se reproducen los clips a la vista, para no saturar el móvil;
    // al volver a uno sigue desde donde se quedó.
    function update() {
      if (!ready) return;
      if (visible || isFs()) v.play().catch(checkBlocked);
      else { v.pause(); gate.classList.remove('show'); }
    }
    function setVisible(on) { visible = on; update(); }

    fetchClip(src, () => visible, p => {
      fig.style.setProperty('--load', p.toFixed(3));
      pct.textContent = `${Math.floor(p * 100)} %`;
    }).then(url => {
      v.src = url;
      ready = true;
      fig.classList.remove('loading');
      update();
    });

    // Pantalla completa: el clip se fija con CSS ocupando todo (girado si el móvil
    // está en vertical), y además se pide la pantalla completa del navegador para
    // esconder sus barras y, en Android, girar a horizontal. Así se ve igual en
    // cualquier móvil, también en los que no la conceden (iPhone).
    function fakeFs(on) {
      screen.classList.toggle('fake-fs', on);
      document.body.classList.toggle('fs-lock', on);
      update();
    }
    function enterFs() {
      fakeFs(true);
      const root = document.documentElement;
      const req = root.requestFullscreen || root.webkitRequestFullscreen;
      try {
        const p = req && req.call(root);
        if (p && p.then) p.then(() => window.screen.orientation?.lock?.('landscape').catch(() => {}), () => {});
      } catch (_) {}
    }
    function exitFs() {
      fakeFs(false);
      if (nativeFsEl()) {
        try { window.screen.orientation?.unlock?.(); } catch (_) {}
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      }
    }
    screen.addEventListener('click', () => (isFs() ? exitFs() : enterFs()));
    screen.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); screen.click(); }
    });
    fig.querySelector('.fs-close').addEventListener('click', e => { e.stopPropagation(); exitFs(); });

    return { screen, setVisible, isFs, exitFs };
  }

  const clips = CLIPS.map(createClip);

  // Si se sale con el botón atrás o Esc del navegador, también se cierra la nuestra.
  const exitAll = () => clips.forEach(c => c.isFs() && c.exitFs());
  const onFsChange = () => { if (!nativeFsEl()) exitAll(); };
  document.addEventListener('fullscreenchange', onFsChange);
  document.addEventListener('webkitfullscreenchange', onFsChange);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') exitAll(); });

  const io = new IntersectionObserver(entries => {
    entries.forEach(e => clips.find(c => c.screen === e.target).setVisible(e.isIntersecting));
    if (!visibleKnown) { visibleKnown = true; pump(); }
  }, { threshold: 0.15 });
  clips.forEach(c => io.observe(c.screen));
})();
</script>
</body>
</html>
